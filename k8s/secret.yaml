apiVersion: v1
kind: Secret
metadata:
  name: herdoc-backend-secrets
  labels:
    app.kubernetes.io/name: herdoc-backend
type: Opaque
stringData:
  # Replace both placeholders locally before applying. Never use production credentials in Git.
  DATABASE_URL: "mysql+pymysql://REPLACE_USER:REPLACE_PASSWORD@REPLACE_DB_HOST:3306/herdoc?charset=utf8mb4"
  JWT_SECRET: "REPLACE_WITH_A_RANDOM_SECRET_OF_AT_LEAST_32_CHARACTERS"
