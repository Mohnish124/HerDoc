apiVersion: batch/v1
kind: Job
metadata:
  name: herdoc-db-migrate
  labels:
    app.kubernetes.io/name: herdoc-backend
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: herdoc-db-migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: herdoc-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: herdoc-backend-config
            - secretRef:
                name: herdoc-backend-secrets
